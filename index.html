    const state = {
      tab: 'dashboard',

    const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

    function applyTheme() {
      document.documentElement.classList.toggle('dark', state.theme === 'dark');
      const cls = state.theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
      const t = document.getElementById('top-theme-ico'), r = document.getElementById('rail-theme-ico');
      if (t) t.className = cls;
      if (r) r.className = cls + ' text-xs';
      localStorage.setItem('eb_ot_theme_v2', state.theme);
      if (state.tab === 'dashboard') renderCharts();
    }
    function toggleTheme() { state.theme = state.theme === 'dark' ? 'light' : 'dark'; applyTheme(); }
    function toggleCollapse() {
      state.collapsed = !state.collapsed;
      document.getElementById('sidebar-shell').classList.toggle('collapsed', state.collapsed);
      const exp = document.getElementById('sb-expand-wrap');
      if (exp) { exp.classList.toggle('hidden', !state.collapsed); exp.classList.toggle('flex', state.collapsed); }
    }
    function toggleMobileSidebar(open) {
      document.getElementById('sidebar-shell').classList.toggle('-translate-x-[115%]', !open);
      document.getElementById('sidebar-backdrop').classList.toggle('hidden', !open);
    }
    function switchTab(t) {
      state.tab = t;
      toggleMobileSidebar(false);
      document.querySelectorAll('.v10-nav-btn').forEach(b => b.classList.toggle('v10-active', b.dataset.tab === t));
      const lbl = document.getElementById('rail-label');
      if (lbl) lbl.textContent = t === 'dashboard' ? 'DASHBOARD' : t === 'eb' ? 'BESOINS EB' : 'OT PDR';
      render();
    }
    function onSearch(val) {
      state.search = val;
      const a = document.getElementById('top-search'), b = document.getElementById('sb-search');
      if (a && a.value !== val) a.value = val;
      if (b && b.value !== val) b.value = val;
      document.getElementById('clear-top-search')?.classList.toggle('hidden', !val);
      document.getElementById('clear-sb-search')?.classList.toggle('hidden', !val);
      render();
    }
    function resetAllFilters() {
      state.search = '';
      state.ebFilters = { dept: 'ALL', project: 'ALL', status: 'ALL', codif: 'ALL', pdrOnly: false };
      state.otFilters = { type: 'ALL', poste: 'ALL', atpdOnly: false, linkedOnly: false };
      const a = document.getElementById('top-search'), b = document.getElementById('sb-search');
      if (a) a.value = ''; if (b) b.value = '';
      document.getElementById('clear-top-search')?.classList.add('hidden');
      document.getElementById('clear-sb-search')?.classList.add('hidden');
      render();
    }
    function closeModal() {
      const m = document.getElementById('detail-modal');
      m.classList.add('hidden'); m.classList.remove('flex');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='b') { e.preventDefault(); toggleCollapse(); } });

    function getFilteredEB() {
      const q = norm(state.search), f = state.ebFilters;
      return EB_DATA.filter(r => {
        if (f.dept !== 'ALL' && r.dept !== f.dept) return false;
        if (f.project !== 'ALL' && r.project !== f.project) return false;
        if (f.status !== 'ALL' && r.status !== f.status) return false;
        if (f.codif === 'COD' && !r.codifie) return false;
        if (f.codif === 'NC' && r.codifie) return false;
        if (f.pdrOnly && !r.linked_ots.length) return false;
        if (q) {
          const hay = `${r.dept} ${r.project} ${r.sap} ${r.item} ${r.des} ${r.ot_ref} ${r.status} ${r.linked_ots.map(o=>o.ordre).join(' ')}`;
          if (!norm(hay).includes(q)) return false;
        }
        return true;
      });
    }

    function getFilteredOT() {
      const q = norm(state.search), f = state.otFilters;
      return ATPD_DATA.filter(o => {
        if (f.atpdOnly && !o.atpd) return false;
        if (f.linkedOnly && (!o.eb_matches || !o.eb_matches.length)) return false;
        if (f.type !== 'ALL' && o.type !== f.type) return false;
        if (f.poste !== 'ALL' && o.poste !== f.poste) return false;
        if (q) {
          const hay = `${o.ordre} ${o.type} ${o.des} ${o.poste} ${o.equip} ${o.stat_sys} ${o.stat_usr} ${o.sap} ${o.item} ${o.eb_matches.map(e=>e.project+' '+e.des).join(' ')}`;
          if (!norm(hay).includes(q)) return false;
        }
        return true;
      });
    }

    function exportFilteredExcel() {
      const eb = getFilteredEB().map(r => ({
        Departement: r.dept, Project: r.project, 'N°': r.no, 'SAP Code': r.sap, 'Item Code': r.item,
        Designation: r.des, 'DDEE Qte': r.qte, 'Statut Projet (Opt B)': r.status, "Date d'envoi": r.date_envoi,
        'OT Liés': r.linked_ots.map(o => o.ordre).join(', ')
      }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(eb), 'EB_Filtre');
      XLSX.writeFile(wb, 'Export_EB_OT_PDR_OptionB.xlsx');
    }

    function renderCharts() {
      const dark = state.theme === 'dark';
      const txt = dark ? '#e2e8f0' : '#1e293b';
      const grid = dark ? 'rgba(255,255,255,0.10)' : 'rgba(15,23,42,0.08)';
      ['c1','c2','c3','c4'].forEach(k => { if (state.charts[k]) { state.charts[k].destroy(); state.charts[k] = null; } });

      const eb = getFilteredEB();
      const pCnt = {}; eb.forEach(r => pCnt[r.project] = (pCnt[r.project]||0)+1);
      const topP = Object.entries(pCnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
      state.charts.c1 = new Chart(document.getElementById('c1'), {
        type: 'bar',
        data: { labels: topP.map(x=>x[0]), datasets: [{ label: 'Articles EB', data: topP.map(x=>x[1]), backgroundColor: '#f59e0b', borderRadius: 6 }] },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { beginAtZero: true, ticks: { color: txt }, grid: { color: grid } }, y: { ticks: { color: txt, font: { size: 10 } }, grid: { display: false } } }, plugins: { legend: { display: false } } }
      });

      const sCnt = {}; eb.forEach(r => sCnt[r.status] = (sCnt[r.status]||0)+1);
      const sLabels = Object.keys(sCnt);
      state.charts.c2 = new Chart(document.getElementById('c2'), {
        type: 'doughnut',
        data: { labels: sLabels, datasets: [{ data: sLabels.map(l=>sCnt[l]), backgroundColor: ['#10b981','#0284c7','#f59e0b','#64748b'], borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'right', labels: { color: txt, font: { size: 11 } } } } }
      });

      const tMap = state.otFilters.type === 'ALL' ? OT_SUMMARY.atpd_by_type : { [state.otFilters.type]: OT_SUMMARY.atpd_by_type[state.otFilters.type] || 0 };
      state.charts.c3 = new Chart(document.getElementById('c3'), {
        type: 'bar',
        data: { labels: Object.keys(tMap), datasets: [{ label: 'OT Bloqués ATPD', data: Object.values(tMap), backgroundColor: '#e11d48', borderRadius: 6 }] },
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: txt }, grid: { display: false } }, y: { beginAtZero: true, ticks: { color: txt }, grid: { color: grid } } }, plugins: { legend: { display: false } } }
      });

      const poMap = state.otFilters.poste === 'ALL' ? OT_SUMMARY.atpd_by_poste : { [state.otFilters.poste]: OT_SUMMARY.atpd_by_poste[state.otFilters.poste] || 0 };
      state.charts.c4 = new Chart(document.getElementById('c4'), {
        type: 'bar',
        data: { labels: Object.keys(poMap), datasets: [{ label: 'OT Bloqués ATPD', data: Object.values(poMap), backgroundColor: '#7c3aed', borderRadius: 6 }] },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { beginAtZero: true, ticks: { color: txt }, grid: { color: grid } }, y: { ticks: { color: txt, font: { size: 10 } }, grid: { display: false } } }, plugins: { legend: { display: false } } }
      });
    }

              </tbody>
            </table>
          </div>
        </div>`;
    }

    function renderOTTable() {
      const rows = getFilteredOT();
      document.getElementById('viewport').innerHTML = `
        <div class="space-y-3">
          <div class="glass-card p-3 rounded-2xl flex flex-wrap justify-between items-center gap-2 text-xs">
            <div class="flex flex-wrap gap-3">
              <label class="flex items-center gap-1.5 font-semibold cursor-pointer"><input type="checkbox" ${state.otFilters.atpdOnly?'checked':''} onchange="state.otFilters.atpdOnly=this.checked; render();" class="accent-rose-500" /> Bloqués PDR (ATPD) uniquement</label>
              <label class="flex items-center gap-1.5 font-semibold cursor-pointer"><input type="checkbox" ${state.otFilters.linkedOnly?'checked':''} onchange="state.otFilters.linkedOnly=this.checked; render();" class="accent-emerald-500" /> Liés à un Besoin EB</label>
            </div>
            <div class="mono text-slate-600 dark:text-slate-300"><strong>${rows.length}</strong> OT affichés</div>
          </div>
          <div class="glass-card rounded-2xl overflow-hidden">
            <div class="overflow-x-auto max-h-[68vh]">
              <table class="data-table w-full text-left text-xs">
                <thead><tr class="bg-white/80 dark:bg-slate-900/80 border-b border-slate-300/40 dark:border-white/10 text-[11px] uppercase text-slate-600 dark:text-slate-300">
                  <th class="py-2.5 px-3">Ordre</th><th class="py-2.5 px-3">Type</th><th class="py-2.5 px-3">Désignation</th><th class="py-2.5 px-3">Poste</th><th class="py-2.5 px-3">Statut Util.</th><th class="py-2.5 px-3">SAP / Item</th><th class="py-2.5 px-3">Besoin EB</th>
                </tr></thead>
                <tbody class="divide-y divide-slate-300/35 dark:divide-white/10">
                  ${rows.slice(0, 250).map(o => `
                    <tr onclick="openOTModal('${esc(o.ordre)}')" class="cursor-pointer hover:bg-amber-500/10">
                      <td class="py-2.5 px-3 mono font-bold text-sky-600 dark:text-sky-400">${esc(o.ordre)}</td>
                      <td class="py-2.5 px-3 mono">${esc(o.type)}</td>
                      <td class="py-2.5 px-3">${esc(o.des)}</td>
                      <td class="py-2.5 px-3 mono">${esc(o.poste)}</td>
                      <td class="py-2.5 px-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${o.atpd?'bg-rose-500/20 text-rose-600':'bg-slate-500/20 text-slate-600'}">${esc(o.stat_usr)}</span></td>
                      <td class="py-2.5 px-3 mono">${esc(o.sap || o.item || '-')}</td>
                      <td class="py-2.5 px-3">${o.eb_matches.length ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-700">${o.eb_matches.length} EB</span>` : '<span class="text-slate-400">-</span>'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      switchTab('dashboard');
    });
  </script>
</body>
</html>
